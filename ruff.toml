target-version = "py310"
line-length = 120

[lint]
select = ["E4", "E7", "E9", "F", "B"]

[lint.per-file-ignores]
# Odoo registers modules through imports and reads manifests as dictionary literals.
"**/__init__.py" = ["F401"]
"**/__manifest__.py" = ["B018"]
# Odoo shell supplies env when loading this script.
"dev/seed_demo.py" = ["F821"]
